<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1408" />
      <stop offset="60%" stop-color="#140803" />
      <stop offset="100%" stop-color="#0a0401" />
    </radialGradient>

    <!-- Outer Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Letter J Gold Gradient -->
    <linearGradient id="jGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Rounded Square / Coin Body -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="20" filter="url(#goldShadow)" />

  <!-- Inner Delicate Gold Inset Border -->
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Corner Flourishes / Card Suit Accents -->
  <polygon points="68,68 76,60 84,68 76,76" fill="#f59e0b" opacity="0.8" />
  <polygon points="444,68 436,60 428,68 436,76" fill="#f59e0b" opacity="0.8" />
  <polygon points="68,444 76,436 84,444 76,452" fill="#f59e0b" opacity="0.8" />
  <polygon points="444,444 436,436 428,444 436,452" fill="#f59e0b" opacity="0.8" />

  <!-- Jackpot Crown above the J -->
  <g transform="translate(196, 92)" filter="url(#goldShadow)">
    <path d="M0,48 L15,10 L45,32 L60,4 L75,32 L105,10 L120,48 Z" fill="url(#goldRim)" />
    <circle cx="15" cy="8" r="5" fill="#fef08a" />
    <circle cx="60" cy="3" r="6" fill="#fef08a" />
    <circle cx="105" cy="8" r="5" fill="#fef08a" />
    <circle cx="60" cy="36" r="4" fill="#991b1b" />
    <circle cx="36" cy="36" r="3" fill="#0284c7" />
    <circle cx="84" cy="36" r="3" fill="#0284c7" />
  </g>

  <!-- Stylized Bold Jackpot "J" -->
  <path d="M296,170 L348,170 C352,170 356,174 356,178 L356,220 C356,224 352,228 348,228 L296,228 L296,335 C296,370 274,395 235,395 C190,395 160,365 160,325 C160,318 165,312 172,312 L212,312 C218,312 222,316 224,321 C227,332 233,342 248,342 C262,342 270,332 270,316 L270,178 C270,174 274,170 278,170 Z" 
        fill="url(#jGold)" 
        stroke="#451a03" 
        stroke-width="5" 
        filter="url(#goldShadow)" />

  <!-- Shiny Sparkle Accents -->
  <g transform="translate(340, 160)">
    <path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z" fill="#ffffff" opacity="0.9" />
  </g>
  <g transform="translate(165, 300)">
    <path d="M0,-8 Q0,0 8,0 Q0,0 0,8 Q0,0 -8,0 Q0,0 0,-8 Z" fill="#fef08a" opacity="0.8" />
  </g>
</svg>
